# Beneigh 生产 Nginx 反代配置
# 用法：
#   cp beneigh.nginx.conf /etc/nginx/sites-available/beneigh.conf
#   ln -sf /etc/nginx/sites-available/beneigh.conf /etc/nginx/sites-enabled/beneigh.conf
#   nginx -t && systemctl reload nginx
#
# 端口说明：APP_PORT 须与启动命令/服务里的一致（脚本默认 3100）。
# SSL：示例用 certbot 签发的证书；若已有其他证书，修改下面两个路径即可。

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name beneigh.com www.beneigh.com;

    # 证书申请挑战目录（certbot 使用，无需可删）
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location / { return 301 https://$host$request_uri; }
}

# HTTPS 反代到本地 Next.js
server {
    listen 443 ssl http2;
    server_name beneigh.com www.beneigh.com;

    ssl_certificate     /etc/letsencrypt/live/beneigh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beneigh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 反代核心
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Next.js 静态资源长缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
